  <p>Las formas más rápidas de contactarme son GitHub, YouTube o LinkedIn — los enlaces están en el pie de página — o el formulario de abajo.</p>

  <form action="https://api.web3forms.com/submit" method="POST"
        data-success="Tu mensaje fue enviado. ¡Gracias! Te responderé pronto."
        data-error="Algo salió mal y el mensaje no se envió. Inténtalo de nuevo o escríbeme por los enlaces del pie de página.">
    <input type="hidden" name="access_key" value="7e8626a2-fef4-4fc9-ae7a-acf2d8cd8f57">

    <input type="hidden" name="redirect" value="https://johanalejandrolopezarias.com/es/contact-received.html">

    <!-- Honeypot: real visitors never see or fill this in; bots that auto-fill every field do, so submissions with it non-empty are spam. -->
    <div class="form-field hp-field" aria-hidden="true">
      <label for="botcheck">Deja este campo vacío</label>
      <input type="text" id="botcheck" name="botcheck" tabindex="-1" autocomplete="off">
    </div>

    <div class="form-field">
      <label for="name">Nombre</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="form-field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-field">
      <label for="message">Mensaje</label>
      <textarea id="message" name="message" rows="6" required></textarea>
    </div>

    <button type="submit">Enviar</button>
