<article class="detail">
  <header class="detail-header">
    <h1>{{title}}</h1>
    <p class="detail-meta">
      <time datetime="{{date}}">{{date_display}}</time>
      · filed under <a href="{{discipline_url}}">{{discipline}}</a>
    </p>
  </header>
  {{content}}
  <footer class="detail-footer">
    {{tech_list}}
  </footer>
</article>
